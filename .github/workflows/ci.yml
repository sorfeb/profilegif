name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # keep the CI toolchain in sync with the module
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Render smoke test
        run: |
          # default theme is "both", so this writes -dark and -light variants
          go run . render -user octocat -mock -o /tmp/smoke.gif
          test -s /tmp/smoke-dark.gif
          test -s /tmp/smoke-light.gif
